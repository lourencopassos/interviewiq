name: Bug report
description: Something is broken or behaves differently from the docs.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do **not** paste API keys, CV text or interview transcripts.
        Security problems go through private reporting instead, see [SECURITY.md](https://github.com/lourencopassos/interviewiq/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /new and paste a job description
        2. Pick "Technical", English, video off
        3. ...
    validations:
      required: true
  - type: dropdown
    id: mock
    attributes:
      label: Mock mode
      options:
        - "Off (real API calls)"
        - "On (no API calls)"
    validations:
      required: true
  - type: checkboxes
    id: keys
    attributes:
      label: Which keys are set
      description: Only say whether they are set. Never paste the values.
      options:
        - label: ANTHROPIC_API_KEY
        - label: OPENAI_API_KEY
        - label: ELEVENLABS_API_KEY
        - label: DID_API_KEY
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 131, Firefox 133, Safari 18.2 ...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15, Windows 11, Ubuntu 24.04 ...
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node -v`
      placeholder: v20.19.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server log excerpt
      description: The terminal output of `pnpm dev` / `pnpm start` around the failure. Remove anything personal.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Browser console errors, screenshots, the interview type and language, video on/off.
